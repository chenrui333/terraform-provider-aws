# Builds, signs and publishes a Justworks canary of terraform-provider-aws.
# Input: jw-release.json at the root of this branch ({"ref": "<commit sha>", "version": "<semver>"}).
name: jw-release

on:
  push:
    branches:
      - jw-release
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: jw-release
  cancel-in-progress: false

env:
  NAME: terraform-provider-aws
  SIGNING_KEY_FPR: BC8C30954D11DF6BAB41BE730BB9E23BABAF1127
  UPSTREAM_REPO: hashicorp/terraform-provider-aws

jobs:
  config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.config.outputs.ref }}
      version: ${{ steps.config.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: config
        run: |
          ref="$(jq -er .ref jw-release.json)"
          version="$(jq -er .version jw-release.json)"
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::ref must be a full 40-hex commit SHA: $ref"; exit 1; }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::version is not semver: $version"; exit 1; }
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        target: [linux_amd64, linux_arm64, darwin_arm64]
    env:
      REF: ${{ needs.config.outputs.ref }}
      VERSION: ${{ needs.config.outputs.version }}
      TARGET: ${{ matrix.target }}
      CGO_ENABLED: "0"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.config.outputs.ref }}
          persist-credentials: false
      - run: test "$(git rev-parse HEAD)" = "$REF"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        run: |
          export GOOS="${TARGET%_*}" GOARCH="${TARGET#*_}"
          out="$RUNNER_TEMP/out"
          bin="${NAME}_v${VERSION}_x5"
          mkdir -p "$out" dist
          go build \
            -o "$out/$bin" \
            -trimpath \
            -buildvcs=false \
            -ldflags "-s -w -X 'github.com/hashicorp/terraform-provider-aws/version.ProviderVersion=${VERSION}'"
          cp LICENSE "$out/LICENSE"
          mtime="$(git log -1 --format=%cd --date=format:%Y%m%d%H%M.%S)"
          touch -t "$mtime" "$out/$bin" "$out/LICENSE"
          (cd "$out" && zip -q -X "$GITHUB_WORKSPACE/dist/${NAME}_${VERSION}_${TARGET}.zip" "$bin" LICENSE)
          (cd "$out" && sha256sum "$bin" | sed "s#  #  ${TARGET}/#") > "dist/binary-${TARGET}.sha256"
          go env GOVERSION > "dist/go-version-${TARGET}.txt"
          unzip -l "dist/${NAME}_${VERSION}_${TARGET}.zip"
          cat "dist/binary-${TARGET}.sha256" "dist/go-version-${TARGET}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [config, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      REF: ${{ needs.config.outputs.ref }}
      VERSION: ${{ needs.config.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::release v$VERSION already exists; bump version in jw-release.json"
            exit 1
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: build
          merge-multiple: true
      - name: Manifest and SHA256SUMS
        working-directory: build
        run: |
          mkdir ../release
          mv ./*.zip ../release/
          cd ../release
          printf '%s\n' '{"version":1,"metadata":{"protocol_versions":["5.0"]}}' > "${NAME}_${VERSION}_manifest.json"
          sha256sum ./*.zip ./*_manifest.json | sed 's#  \./#  #' > "${NAME}_${VERSION}_SHA256SUMS"
          cat "${NAME}_${VERSION}_SHA256SUMS"
      - name: Sign SHA256SUMS
        working-directory: release
        env:
          GPG_PRIVATE_KEY: ${{ secrets.JW_CANARY_GPG_PRIVATE_KEY }}
        run: |
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/gnupg-sign.XXXXXX")"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --quiet --import
          gpg --list-secret-keys --with-colons | awk -F: '/^fpr/{print $10}' | grep -x "$SIGNING_KEY_FPR" >/dev/null \
            || { echo "::error::secret does not contain key $SIGNING_KEY_FPR"; exit 1; }
          gpg --batch --yes --local-user "$SIGNING_KEY_FPR" --detach-sign \
            --output "${NAME}_${VERSION}_SHA256SUMS.sig" "${NAME}_${VERSION}_SHA256SUMS"
          gpg --armor --export "$SIGNING_KEY_FPR" > "${NAME}_${VERSION}_signing-key.pub.asc"
      - name: Verify signature and checksums with a clean keyring
        working-directory: release
        run: |
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/gnupg-verify.XXXXXX")"
          export GNUPGHOME
          chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          gpg --batch --quiet --import "${NAME}_${VERSION}_signing-key.pub.asc"
          gpg --batch --status-fd 1 --verify "${NAME}_${VERSION}_SHA256SUMS.sig" "${NAME}_${VERSION}_SHA256SUMS" \
            | tee verify.status
          grep -E "^\[GNUPG:\] VALIDSIG .* ${SIGNING_KEY_FPR}\$" verify.status
          rm verify.status
          sha256sum -c "${NAME}_${VERSION}_SHA256SUMS"
      - name: Provenance
        run: |
          base="$(gh api "repos/$UPSTREAM_REPO/compare/main...${GITHUB_REPOSITORY_OWNER}:${GITHUB_REPOSITORY#*/}:$REF" --jq .merge_base_commit.sha)"
          ahead="$(gh api "repos/$UPSTREAM_REPO/compare/main...${GITHUB_REPOSITORY_OWNER}:${GITHUB_REPOSITORY#*/}:$REF" --jq .ahead_by)"
          gover="$(sort -u build/go-version-*.txt)"
          [ "$(printf '%s\n' "$gover" | wc -l)" -eq 1 ] || { echo "::error::targets built with different Go versions: $gover"; exit 1; }
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT"
          {
            echo "# ${NAME} v${VERSION} provenance"
            echo
            echo "Justworks canary build. Not an official HashiCorp release."
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Upstream base SHA | \`$base\` (merge base with \`$UPSTREAM_REPO@main\`) |"
            echo "| Patch SHA (tagged) | \`$REF\` ($ahead commits on top of base) |"
            echo "| Go version | \`$gover\` |"
            echo "| Build flags | \`CGO_ENABLED=0 go build -trimpath -buildvcs=false -ldflags \"-s -w -X github.com/hashicorp/terraform-provider-aws/version.ProviderVersion=${VERSION}\"\` |"
            echo "| Built by | GitHub Actions run $run_url |"
            echo "| Signing key | \`$SIGNING_KEY_FPR\` (Justworks AWS provider canary) |"
            echo
            echo "## SHA256SUMS"
            echo
            echo '```'
            cat "release/${NAME}_${VERSION}_SHA256SUMS"
            echo '```'
            echo
            echo "## Unzipped provider binaries (sha256)"
            echo
            echo '```'
            cat build/binary-*.sha256
            echo '```'
          } > release/PROVENANCE.md
          cat release/PROVENANCE.md
      - name: Annotated tag
        run: |
          tag="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
            read -r type sha < <(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '"\(.object.type) \(.object.sha)"')
            if [ "$type" = "tag" ]; then
              sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)"
            fi
            [ "$sha" = "$REF" ] || { echo "::error::tag $tag exists at $sha, not $REF"; exit 1; }
            echo "tag $tag already points at $REF"
            exit 0
          fi
          tag_obj="$(gh api "repos/$GITHUB_REPOSITORY/git/tags" \
            -f tag="$tag" -f object="$REF" -f type=commit \
            -f message="${NAME} ${tag} (Justworks canary)" --jq .sha)"
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$tag" -f sha="$tag_obj" --jq .ref
      - name: Pre-release
        working-directory: release
        run: |
          gh release create "v$VERSION" \
            --verify-tag \
            --prerelease \
            --latest=false \
            --title "v$VERSION (Justworks canary)" \
            --notes-file PROVENANCE.md \
            ./*.zip \
            "${NAME}_${VERSION}_manifest.json" \
            "${NAME}_${VERSION}_SHA256SUMS" \
            "${NAME}_${VERSION}_SHA256SUMS.sig" \
            "${NAME}_${VERSION}_signing-key.pub.asc" \
            PROVENANCE.md
          gh release view "v$VERSION" --json url,isPrerelease,isDraft,tagName,assets \
            --jq '{url,isPrerelease,isDraft,tagName,assets:[.assets[].name]}'
